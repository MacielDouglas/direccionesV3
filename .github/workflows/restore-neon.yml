name: Restore Neon Database

on:
  workflow_dispatch:
    inputs:
      backup_file:
        description: "Nome do backup criptografado no Google Drive"
        required: true
        type: string
      confirmation:
        description: "Digite RESTORE_PRODUCTION para confirmar"
        required: true
        type: string

jobs:
  prepare:
    name: Validate backup
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates lsb-release gnupg

          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg

          sudo wget --quiet \
            -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.config/rclone"

          echo "$RCLONE_CONFIG_B64" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Validate confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "RESTORE_PRODUCTION" ]; then
            echo "Confirmação inválida."
            exit 1
          fi

      - name: Validate backup filename
        env:
          BACKUP_FILE: ${{ inputs.backup_file }}
        run: |
          if [[ "$BACKUP_FILE" != *.dump ]]; then
            echo "O arquivo informado não é um backup .dump."
            exit 1
          fi

          if [[ "$BACKUP_FILE" == */* ]]; then
            echo "O nome do backup não pode conter subpastas."
            exit 1
          fi

      - name: Check backup exists
        env:
          BACKUP_FILE: ${{ inputs.backup_file }}
        run: |
          echo "Procurando backup: $BACKUP_FILE"

          if ! rclone lsf "gdrive-crypt:" \
            --files-only \
            --include "*.dump" \
            | grep -Fx -- "$BACKUP_FILE"; then

            echo "Backup não encontrado no Google Drive criptografado."
            exit 1
          fi

          echo "Backup encontrado."

      - name: Download backup for validation
        env:
          BACKUP_FILE: ${{ inputs.backup_file }}
        run: |
          mkdir -p restore

          rclone copyto \
            "gdrive-crypt:$BACKUP_FILE" \
            "restore/backup.dump" \
            --progress

          ls -lh restore/backup.dump

      - name: Validate backup contents
        run: |
          /usr/lib/postgresql/17/bin/pg_restore \
            --list \
            restore/backup.dump \
            > restore/contents.txt

          echo "Quantidade de objetos no backup:"
          wc -l restore/contents.txt

          test -s restore/contents.txt

          echo "Backup validado com sucesso."
