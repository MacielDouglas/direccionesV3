name: Backup Neon Database

on:
  schedule:
    - cron: '0 6 * * *' # Todos os dias às 06:00 UTC (03:00 em Brasília)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates lsb-release gnupg

          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg

          sudo wget --quiet \
            -O /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          echo "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Test Google Drive
        run: |
          rclone lsd gdrive:

      - name: Create backup
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          mkdir -p backup

          TIMESTAMP=$(date -u +"%Y-%m-%d-%H-%M-%S")
          BACKUP_FILE="backup/neon-${TIMESTAMP}.dump"

          /usr/lib/postgresql/17/bin/pg_dump \
            "$NEON_DATABASE_URL" \
            --format=custom \
            --file="$BACKUP_FILE"

          echo "Backup criado:"
          ls -lh "$BACKUP_FILE"

          test -s "$BACKUP_FILE"

      - name: Upload backup to encrypted Google Drive
        run: |
           rclone copy "backup" "gdrive-crypt:" --progress

      - name: Verify backup
        run: |
          rclone lsf "gdrive-crypt:" --max-depth 1

      - name: Remove encrypted backups older than 30 days
        run: |
          rclone delete "gdrive-crypt:" --min-age 30d
